module: 01-components-and-templates
title: 1. Components & templates
questions:
  - id: ng-01
    type: predict
    topic: signals-in-templates
    difficulty: 1
    placement: false
    prompt: '`isLoading` is a signal that is `false`. What does the feed show?'
    context:
      lang: ts
      label: feed.component.ts
      source: |
        export class FeedComponent {
          readonly isLoading = signal(false);
          readonly posts = signal<Post[]>([]);
        }
    code:
      lang: html
      label: feed.component.html
      source: |
        @if (isLoading) {
          <div class="spinner"></div>
        } @else {
          @for (post of posts(); track post.id) {
            <app-post-card [post]="post" />
          }
        }
    options:
      - text: 'Always the spinner, never the posts'
        correct: true
      - text: 'The posts'
        correct: false
      - text: 'Nothing: the build fails'
        correct: false
    explanation: 'A signal is a function, so `isLoading` without `()` is always truthy. Read a signal by calling it: `@if (isLoading())`.'
    reference: 03-templates/05-control-flow.md

  - id: ng-02
    type: spot-the-bug
    topic: inputs
    difficulty: 1
    placement: false
    prompt: 'The header shows the text "user.username" instead of the name. Click the buggy line.'
    context:
      lang: ts
      label: avatar.component.ts
      source: |
        export class AvatarComponent {
          readonly username = input.required<string>();
          readonly imageUrl = input.required<string>();
        }
    code:
      lang: html
      label: post-header.component.html
      source: |
        <div class="post-header">
          <app-avatar [imageUrl]="user.imageUrl" username="user.username" />
          <span class="post-time">{{ post.createdAt | date: 'short' }}</span>
        </div>
    answer: 2
    explanation: 'Without square brackets, `username="user.username"` passes the literal string. To pass the value of an expression, bind it: `[username]="user.username"`.'
    reference: 03-templates/02-binding.md

  - id: ng-03
    type: spot-the-bug
    topic: events
    difficulty: 1
    placement: false
    prompt: 'Clicking the heart does nothing, and there is no error. Click the buggy line.'
    context:
      lang: ts
      label: like-button.component.ts
      source: |
        export class LikeButtonComponent {
          readonly liked = output<void>();

          like() {
            this.liked.emit();
          }
        }
    code:
      lang: html
      label: like-button.component.html
      source: |
        <button class="like-button" type="button" (click)="like">
          <i class="pi pi-heart"></i>
        </button>
    answer: 1
    explanation: '`(click)="like"` only refers to the method, it never calls it. Event bindings run a statement, so write `(click)="like()"`. Recent Angular versions can also warn about this at build time.'
    reference: 03-templates/03-event-listeners.md

  - id: ng-04
    type: pick-the-fix
    topic: inputs
    difficulty: 2
    placement: false
    prompt: 'This component throws an error as soon as it is created. Which version fixes it?'
    code:
      lang: ts
      label: post-card.component.ts
      source: |
        export class PostCardComponent {
          readonly post = input.required<Post>();
          readonly likeCount: number;

          constructor() {
            this.likeCount = this.post().likes;
          }
        }
    options:
      - code: |
          export class PostCardComponent {
            readonly post = input.required<Post>();
            readonly likeCount = computed(() => this.post().likes);
          }
        correct: true
      - code: |
          export class PostCardComponent {
            readonly post = input.required<Post>();
            readonly likeCount: number;

            constructor() {
              this.likeCount = this.post()?.likes ?? 0;
            }
          }
        correct: false
      - code: |
          export class PostCardComponent {
            readonly post = input<Post>();
            readonly likeCount: number;

            constructor() {
              this.likeCount = this.post().likes;
            }
          }
        correct: false
    explanation: 'Inputs are set after the constructor runs, and reading a required input before that throws (NG0950). `?.` doesn''t help, because calling `this.post()` is what throws. An optional input is `Post | undefined`, so `.likes` doesn''t build. A `computed` reads the input only when it''s needed, and updates when the post changes.'
    reference: 02-components/04-inputs.md

  - id: ng-05
    type: predict
    topic: styling
    difficulty: 2
    placement: false
    prompt: 'The avatar image is rendered by `<app-avatar>`, inside the post header. Does the `.avatar-image` rule in the post header''s SCSS apply to it?'
    context:
      lang: html
      label: post-header.component.html
      source: |
        <div class="post-header">
          <app-avatar class="post-avatar" [imageUrl]="user.imageUrl" [username]="user.username" />
          <span class="username">{{ user.username }}</span>
        </div>
    code:
      lang: scss
      label: post-header.component.scss
      source: |
        :host {
          .post-header {
            display: flex;
            gap: 8px;
          }

          .avatar-image {
            border-radius: 50%;
          }
        }
    options:
      - text: 'Only if the rule is moved outside `:host`'
        correct: false
      - text: 'No. Component styles only reach elements in the component''s own template. Style the image in `avatar.component.scss`, or style `.post-avatar` from here'
        correct: true
      - text: 'Yes, because `<app-avatar>` is inside `.post-header`'
        correct: false
    explanation: 'With Angular''s default view encapsulation, a component''s styles apply only to its own template. The `<app-avatar>` element itself (`.post-avatar`) is in this template, but the image inside it isn''t.'
    reference: 02-components/03-styling.md

  - id: ng-06
    type: spot-the-bug
    topic: content-projection
    difficulty: 2
    placement: false
    prompt: 'The action buttons passed to the card never show up. Click the buggy line.'
    context:
      lang: html
      label: feed.component.html
      source: |
        <app-card>
          <img class="post-image" [src]="post.imageUrl">
          <div class="actions">
            <app-like-button />
          </div>
        </app-card>
    code:
      lang: html
      label: card.component.html
      source: |
        <div class="card">
          <ng-content select=".post-image" />
          <ng-content select=".post-actions" />
        </div>
    answer: 3
    explanation: '`select` matches a CSS selector against the projected content. The div has the class `actions`, not `post-actions`, so nothing matches and it isn''t shown. With no default `<ng-content />` slot, unmatched content disappears.'
    reference: 02-components/06-content-projection.md

  - id: ng-07
    type: fill
    topic: control-flow
    difficulty: 1
    placement: false
    prompt: 'Without the gap, this template doesn''t build. What goes in the gap?'
    code:
      lang: html
      label: comments-section.component.html
      source: |
        @for (comment of comments(); ___) {
          <app-comment [comment]="comment" />
        } @empty {
          <span class="no-comments">No comments yet</span>
        }
    options:
      - text: '`track comment.id`'
        correct: true
      - text: '`trackBy: comment.id`'
        correct: false
      - text: '`key comment.id`'
        correct: false
      - text: '`let i = $index`'
        correct: false
    explanation: '`@for` requires a `track` expression. Track something unique and stable, like the id. `trackBy` belonged to the old `*ngFor`, and `let i = $index` is allowed but doesn''t replace `track`.'
    reference: 03-templates/05-control-flow.md

  - id: ng-08
    type: predict
    topic: pipes
    difficulty: 1
    placement: false
    prompt: 'What happens when you build this component?'
    context:
      lang: ts
      label: post-header.component.ts
      source: |
        @Component({
          selector: 'app-post-header',
          imports: [AvatarComponent],
          templateUrl: './post-header.component.html',
          styleUrl: './post-header.component.scss',
        })
        export class PostHeaderComponent {
          readonly post = input.required<Post>();
        }
    code:
      lang: html
      label: post-header.component.html
      source: |
        <div class="post-header">
          <app-avatar [imageUrl]="post().author.imageUrl" [username]="post().author.username" />
          <span class="post-time">{{ post().createdAt | date: 'dd/MM/yyyy' }}</span>
        </div>
    options:
      - text: 'The build fails: no pipe named `date` is available here'
        correct: true
      - text: 'It builds, and the date shows as an ISO string'
        correct: false
      - text: 'It builds: built-in pipes are available everywhere'
        correct: false
    explanation: 'A standalone component only has what its `imports` array lists. Add `DatePipe` to `imports`.'
    reference: 03-templates/06-pipes.md

  - id: ng-09
    type: order
    topic: lifecycle
    difficulty: 2
    placement: false
    prompt: 'The feed shows a new `PostCardComponent`. Put the steps in order, from first to last.'
    items:
      - 'The constructor runs, together with the field initializers'
      - 'Angular sets the inputs from the parent''s template'
      - '`ngOnInit` runs'
      - 'The template is rendered and `ngAfterViewInit` runs'
      - '`ngOnDestroy` runs when the post is removed from the feed'
    explanation: 'Inputs arrive after the constructor, which is why reading a required input there throws. `ngOnInit` is the first hook where inputs have values. `ngAfterViewInit` runs once the component''s own view is rendered.'
    reference: 02-components/08-lifecycle.md
