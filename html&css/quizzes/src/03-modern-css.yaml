  - id: mod-14
    type: fill
    topic: container-queries
    difficulty: 3
    placement: false
    prompt: 'The post card should switch layout when its column is wider than 500px. What goes in the gap?'
    code:
      lang: scss
      label: feed.component.scss
      source: |
        :host {
          .post-column {
            container-type: ___;
          }

          .post-card {
            display: block;
          }

          @container (min-width: 500px) {
            .post-card {
              display: flex;
            }
          }
        }
    options:
      - text: '`inline-size`'
        correct: true
      - text: '`size`'
        correct: false
      - text: '`width`'
        correct: false
      - text: '`normal`'
        correct: false
    explanation: '`inline-size` lets children query the container''s width. `size` would also contain its height, so the column no longer grows with its content and collapses to 0 height. `width` isn''t a valid value, and `normal` makes no size container.'
    reference: 03-modern-css/05-container-queries.md
