  - id: css-26
    type: order
    topic: specificity
    difficulty: 2
    placement: false
    prompt: 'All four rules set the color of the same caption. Order them from weakest to strongest.'
    items:
      - '`.caption { color: #8e8e8e; }`'
      - '`.post-card .caption { color: #262626; }`'
      - '`.post-card .caption.is-highlighted { color: #0095f6; }`'
      - '`.caption { color: #ed4956 !important; }`'
    explanation: 'Each extra class adds to the specificity: one class, then two, then three. `!important` beats any specificity, which is why we avoid it: the only way to override it is another `!important`.'
    reference: 02-css-fundamentals-and-layout/04-specificity.md

  - id: css-27
    type: match
    topic: units
    difficulty: 1
    placement: false
    prompt: 'Match each unit with where we use it.'
    pairs:
      - left: '`px`'
        right: 'Fixed sizes from the design, like a 32px avatar'
      - left: '`%`'
        right: 'A size that follows the parent, like an image that fills its card'
      - left: '`vh` and `vw`'
        right: 'Only the top-level app container'
      - left: '`fr`'
        right: 'A share of the free space in a grid'
    explanation: 'Inside components, `vh` and `vw` measure the browser window, not the component''s space, so the component breaks as soon as it sits in a smaller column. `%` and `fr` follow the space the component is given.'
    reference: 02-css-fundamentals-and-layout/06-sizing.md

  - id: css-28
    type: pick-the-fix
    topic: spacing
    difficulty: 1
    placement: false
    prompt: 'The feed should be 470px wide and centered on the page, but it sticks to the left. Which version fixes it?'
    code:
      lang: scss
      label: feed.component.scss
      source: |
        :host {
          .feed {
            max-width: 470px;
            margin: 0;
          }
        }
    options:
      - code: |
          :host {
            .feed {
              max-width: 470px;
              margin: 0 auto;
            }
          }
        correct: true
      - code: |
          :host {
            .feed {
              max-width: 470px;
              margin: 0;
              text-align: center;
            }
          }
        correct: false
      - code: |
          :host {
            .feed {
              max-width: 470px;
              margin: 0;
              justify-content: center;
            }
          }
        correct: false
    explanation: '`auto` on the left and right margins splits the free space equally, which centers a block with a set width. `text-align: center` centers the text inside the feed, not the feed. `justify-content` only works on flex and grid containers.'
    reference: 02-css-fundamentals-and-layout/10-spacing.md
