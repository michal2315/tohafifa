module: 09-final-review
title: 9. Final review
questions:
  - id: final-01
    type: predict
    topic: signals-in-templates
    difficulty: 1
    placement: false
    prompt: 'What happens when you build this?'
    context:
      lang: ts
      label: post-grid.component.ts
      source: |
        export class PostGridComponent {
          readonly posts = input.required<Post[]>();
        }
    code:
      lang: html
      label: post-grid.component.html
      source: |
        <div class="post-grid">
          @for (post of posts; track post.id) {
            <img class="post-thumbnail" [src]="post.imageUrl" [alt]="post.caption">
          }
        </div>
    options:
      - text: 'The build fails: `posts` is a signal, which can''t be looped over'
        correct: true
      - text: 'It builds, and the grid is empty'
        correct: false
      - text: 'It works: Angular reads signals in `@for` automatically'
        correct: false
    explanation: 'An input is a signal, and a signal is a function. Call it: `@for (post of posts(); track post.id)`.'
    reference: 03-templates/05-control-flow.md


  - id: final-02
    type: find-all-bugs
    topic: templates
    difficulty: 2
    placement: false
    prompt: 'Code review: some lines of this template don''t work as intended. Click every one of them.'
    context:
      lang: ts
      label: post-card.component.ts
      source: |
        export class PostCardComponent {
          readonly post = input.required<Post>();
          readonly isLiked = input(false);
          readonly comments = input<Comment[]>([]);
          readonly liked = output<void>();

          like() {
            this.liked.emit();
          }
        }
    code:
      lang: html
      label: post-card.component.html
      source: |
        <div class="post-card">
          <app-post-header [post]="post" />
          @if (isLiked) {
            <i class="pi pi-heart-fill"></i>
          }
          <button class="like-button" type="button" (click)="like">Like</button>
          @for (comment of comments(); track comment.id) {
            <app-comment [comment]="comment" />
          }
          <span class="like-count">{{ post().likes }} likes</span>
        </div>
    answer: [2, 3, 6]
    explanation: 'Line 2 passes the signal itself instead of the post: `[post]="post()"`. Line 3 checks the signal function, which is always truthy: `@if (isLiked())`. Line 6 only refers to the method and never calls it: `(click)="like()"`. The `@for` and the like count are fine.'
    reference: 03-templates/02-binding.md


  - id: final-03
    type: fill
    topic: two-way-binding
    difficulty: 2
    placement: false
    prompt: 'The parent opens and closes the comment form with `[(isOpen)]`, and the form can close itself. What goes in the gap?'
    context:
      lang: html
      label: post-card.component.html
      source: |
        <app-comment-form [(isOpen)]="isFormOpen" />
    code:
      lang: ts
      label: comment-form.component.ts
      source: |
        export class CommentFormComponent {
          readonly isOpen = ___(false);

          close() {
            this.isOpen.set(false);
          }
        }
    options:
      - text: '`model`'
        correct: true
      - text: '`input`'
        correct: false
      - text: '`signal`'
        correct: false
      - text: '`output`'
        correct: false
    explanation: '`model()` is an input the component can also write to: `set` updates it, and the change goes back to the parent through `[(isOpen)]`. An `input()` is read-only, so `set` doesn''t build. A plain `signal()` can''t be bound from the parent.'
    reference: 02-components/04-inputs.md

  - id: final-04
    type: predict
    topic: rxjs-interop
    difficulty: 2
    placement: false
    prompt: 'What happens when you build this?'
    context:
      lang: ts
      label: profile-page.component.ts
      source: |
        export class ProfilePageComponent {
          readonly posts = toSignal(inject(PostsApiService).getFeed());
        }
    code:
      lang: html
      label: profile-page.component.html
      source: |
        <span class="post-count">{{ posts().length }} posts</span>
    options:
      - text: 'The build fails: `posts()` can be `undefined` until the request answers'
        correct: true
      - text: 'It builds and shows "0 posts" until the data arrives'
        correct: false
      - text: 'It builds, and `toSignal` waits for the data before the page renders'
        correct: false
    explanation: 'Without `initialValue`, `toSignal` starts as `undefined`, so its type is `Post[] | undefined` and strict templates reject `.length`. Pass `{ initialValue: [] }`, or write `posts()?.length`.'
    reference: 04-signals/02-signals-interop.md


  - id: final-05
    type: pick-the-fix
    topic: store
    difficulty: 2
    placement: false
    prompt: 'The feed should be sorted by likes. This throws in development, because the array belongs to the store. Which version fixes it?'
    code:
      lang: ts
      label: feed-page.component.ts
      source: |
        export class FeedPageComponent {
          private readonly store = inject(Store);
          readonly posts = this.store.selectSignal(selectAllPosts);

          sortByLikes() {
            this.posts().sort((a, b) => b.likes - a.likes);
          }
        }
    options:
      - code: |
          export class FeedPageComponent {
            private readonly store = inject(Store);
            readonly posts = this.store.selectSignal(selectAllPosts);
            readonly sortedPosts = computed(() => [...this.posts()].sort((a, b) => b.likes - a.likes));
          }
        correct: true
      - code: |
          export class FeedPageComponent {
            private readonly store = inject(Store);
            readonly posts = this.store.selectSignal(selectAllPosts);
            readonly sortedPosts = computed(() => this.posts().sort((a, b) => b.likes - a.likes));
          }
        correct: false
      - code: |
          export class FeedPageComponent {
            private readonly store = inject(Store);
            readonly posts = this.store.selectSignal(selectAllPosts);

            sortByLikes() {
              this.posts.set([...this.posts()].sort((a, b) => b.likes - a.likes));
            }
          }
        correct: false
    explanation: '`[...]` copies the array, and only the copy is sorted. Without the copy, `sort` still changes the store''s frozen array, so moving it into a `computed` throws the same error. A signal from `selectSignal` is read-only, so `set` doesn''t build: the state only changes through actions.'
    reference: 11-ngrx-store/11-runtime-checks.md

  - id: final-06
    type: predict
    topic: effects
    difficulty: 3
    placement: false
    prompt: 'The posts reducer sets `status: ''loading''` on `loadFeed`. The server is down. What does the user see?'
    code:
      lang: ts
      label: posts.effects.ts
      source: |
        export const loadFeed = createEffect(
          (actions$ = inject(Actions), postsApi = inject(PostsApiService)) =>
            actions$.pipe(
              ofType(PostsActions.loadFeed),
              switchMap(() => postsApi.getFeed().pipe(
                map((posts) => PostsActions.loadFeedSuccess({ posts })),
              )),
            ),
          { functional: true },
        );
    options:
      - text: 'A spinner that never stops: no failure action is dispatched, so the status stays `loading`'
        correct: true
      - text: 'An error message from the store'
        correct: false
      - text: 'An empty feed'
        correct: false
    explanation: 'Without `catchError`, the error only reaches the console. Nothing tells the reducer the request failed. Add `catchError((error: HttpErrorResponse) => of(PostsActions.loadFeedFailure({ errorMessage: error.message })))` inside the inner pipe.'
    reference: ../guide/04-store-data-flow.md


  - id: final-07
    type: match
    topic: errors
    difficulty: 2
    placement: false
    prompt: 'Match each error message with its cause.'
    pairs:
      - left: '`NG0950: Input is required but no value is available yet`'
        right: 'A required input was read in the constructor'
      - left: '`NG0203: inject() must be called from an injection context`'
        right: '`inject()` was called inside a method'
      - left: '`NG0600: Writing to signals is not allowed in a computed`'
        right: 'A `computed` calls `set` on another signal'
      - left: '`Can''t bind to ''routerLink'' since it isn''t a known property of ''a''`'
        right: '`RouterLink` is missing from the component''s `imports`'
      - left: '`NullInjectorError: No provider for HttpClient`'
        right: '`provideHttpClient()` is missing from the app config'
    explanation: 'Reading the error before searching for it saves a lot of time. Each of these has come up in an earlier quiz: they are the mistakes almost everyone makes once.'
    reference: ../guide/01-the-project.md
  - id: final-08
    type: single
    topic: styling
    difficulty: 1
    placement: false
    prompt: 'A trainee writes `::ng-deep .p-dialog { border-radius: 8px; }` in the post card''s SCSS. What does it do?'
    options:
      - text: 'It becomes a global rule and changes every dialog in the app, not only the post card''s'
        correct: true
      - text: 'It changes only the dialog inside the post card'
        correct: false
      - text: 'Nothing: Angular 20 removed `::ng-deep`'
        correct: false
    explanation: '`::ng-deep` turns off encapsulation for that rule, so it leaks to every component. Angular strongly discourages it. Use the preset, `[dt]`, or a CSS variable on your own element.'
    reference: ../guide/06-primeng-styled-mode.md
