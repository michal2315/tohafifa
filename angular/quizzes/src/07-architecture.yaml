module: 07-architecture
title: 7. Architecture
questions:
  - id: arch-01
    type: multiple
    topic: presentational
    difficulty: 1
    placement: false
    prompt: 'Which of these may a presentational component like `PostHeaderComponent` use? Pick all.'
    options:
      - text: '`input()` for the author and the date'
        correct: true
      - text: '`output()` to report a click'
        correct: true
      - text: '`routerLink` to link the username to the profile'
        correct: true
      - text: '`inject(Store)` to read the author'
        correct: false
      - text: '`inject(PostsApiService)` to load the author'
        correct: false
    explanation: 'Presentational components get data through inputs and report through outputs. A link is part of the template, not state, so `routerLink` is fine. Only the page components inject the store.'
    reference: ../guide/02-smart-and-presentational.md

  - id: arch-02
    type: order
    topic: data-flow
    difficulty: 2
    placement: false
    prompt: 'The feed page opens. Put the steps of the store loop in order.'
    items:
      - 'The feed page dispatches `loadFeed`'
      - 'The reducer sets `status` to `loading`'
      - 'The effect hears `loadFeed` and calls the API'
      - 'The effect dispatches `loadFeedSuccess` with the posts'
      - 'The reducer saves the posts and sets `status` to `loaded`'
      - 'The selector gives the feed page the new posts'
    explanation: 'Reducers handle an action before effects see it, so the spinner shows while the request is running. The component only dispatches and reads: it never waits for the API.'
    reference: ../guide/04-store-data-flow.md

  - id: arch-03
    type: match
    topic: slices
    difficulty: 1
    placement: false
    prompt: 'Match each file of the posts slice with what goes in it.'
    pairs:
      - left: '`posts.actions.ts`'
        right: 'What happened: the action group'
      - left: '`posts.reducer.ts`'
        right: 'How the state changes for each action'
      - left: '`posts.selectors.ts`'
        right: 'What the components read from the state'
      - left: '`posts.effects.ts`'
        right: 'Calls to the API, and the actions that follow them'
    explanation: 'Each file has one job. If you find an API call in the reducer or state logic in an effect, it''s in the wrong file. (Your team may add more files, like a separate state file.)'
    reference: ../guide/04-store-data-flow.md

  - id: arch-04
    type: single
    topic: devtools
    difficulty: 2
    placement: false
    prompt: 'In Redux DevTools you see `[Posts] Like` dispatched, but the state before and after is the same. What do you check first?'
    options:
      - text: 'The reducer: does it have an `on(...)` for this action, and is the feature registered?'
        correct: true
      - text: 'The component: did it dispatch the action?'
        correct: false
      - text: 'The template: does it read the right selector?'
        correct: false
    explanation: 'The action is there, so the component did its job. If the state didn''t change, the reducer didn''t handle the action. If the state changes but the screen doesn''t, look at the selector and the template.'
    reference: ../guide/04-store-data-flow.md

  - id: arch-05
    type: single
    topic: effects
    difficulty: 2
    placement: false
    prompt: 'The user likes three different posts quickly. Each like must reach the server, and the order doesn''t matter. Which operator does the `like` effect use?'
    options:
      - text: '`mergeMap`'
        correct: true
      - text: '`switchMap`'
        correct: false
      - text: '`exhaustMap`'
        correct: false
    explanation: '`mergeMap` runs the requests in parallel and keeps all of them. `switchMap` would cancel the earlier likes, and `exhaustMap` would ignore new likes while one is running.'
    reference: ../guide/04-store-data-flow.md

  - id: arch-06
    type: single
    topic: state-shape
    difficulty: 1
    placement: false
    prompt: 'Why does the posts state use one `status` field instead of `isLoading` and `hasError` booleans?'
    options:
      - text: 'The state can''t end up "loading and failed" at the same time'
        correct: true
      - text: 'NgRx doesn''t allow boolean fields in the state'
        correct: false
      - text: 'It makes the reducer run faster'
        correct: false
    explanation: 'Two booleans allow four combinations, and one of them makes no sense. One field with `''idle'' | ''loading'' | ''loaded'' | ''error''` only allows the states that exist. (Your team may have its own shape for this.)'
    reference: ../guide/04-store-data-flow.md

  - id: arch-07
    type: single
    topic: style-guide
    difficulty: 1
    placement: false
    prompt: 'The like button calls a method when it is clicked. Which name does the Angular style guide prefer?'
    options:
      - text: '`(click)="like()"`'
        correct: true
      - text: '`(click)="onClick()"`'
        correct: false
      - text: '`(click)="handleClick()"`'
        correct: false
    explanation: 'Name event handlers for what they do, not for the event that triggers them. `like()` says what happens; `onClick()` only repeats what the template already shows.'
    reference: 09-architecture/01-style-guide.md
