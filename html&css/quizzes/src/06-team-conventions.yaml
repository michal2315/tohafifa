module: 06-team-conventions
title: 6. Our conventions (code review)
questions:
  - id: conv-01
    type: spot-the-bug
    topic: wrappers
    difficulty: 1
    placement: false
    lint: false
    prompt: 'Code review: this works, but one element is unnecessary. Click the line that opens it.'
    code:
      lang: html
      label: post-header.component.html
      source: |
        <div class="post-header">
          <div class="avatar-wrapper">
            <img class="avatar" src="noa.jpg">
          </div>
          <span class="username">noa_k</span>
        </div>
    answer: 2
    explanation: '`.avatar-wrapper` wraps a single element and adds nothing. Put its styles on `.avatar` and remove the wrapper. Every extra element is more HTML to read, more to style and one more level of nesting.'

  - id: conv-02
    type: spot-the-bug
    topic: wrappers
    difficulty: 2
    placement: false
    lint: false
    prompt: 'Code review: one element here is a useless wrapper. Click the line that opens it.'
    code:
      lang: html
      label: post-card.component.html
      source: |
        <div class="post-footer">
          <span class="likes">128 likes</span>
          <div class="caption">
            <span class="caption-text">Sunset at the beach</span>
          </div>
        </div>
    answer: 3
    explanation: '`.caption` only wraps `.caption-text`. One element is enough: `<div class="caption">Sunset at the beach</div>`.'

  - id: conv-03
    type: spot-the-bug
    topic: tags
    difficulty: 1
    placement: false
    lint: false
    prompt: 'Code review: one line uses a tag we do not use. Click it.'
    code:
      lang: html
      label: profile-header.component.html
      source: |
        <div class="profile-header">
          <img class="profile-avatar" src="noa.jpg">
          <h2 class="profile-name">Noa Katz</h2>
          <span class="profile-bio">Photographer</span>
        </div>
    answer: 3
    explanation: 'We do not use heading tags. They come with browser default margins and font sizes that you then have to undo. Use a `<div>` or `<span>` with a class and give the class the font size and weight from the design.'

  - id: conv-04
    type: spot-the-bug
    topic: comments
    difficulty: 1
    placement: false
    lint: false
    prompt: 'Code review: one line breaks our conventions. Click it.'
    code:
      lang: scss
      label: post-card.component.scss
      source: |
        :host {
          .post-card {
            display: flex;
            // vertical layout for mobile
            flex-direction: column;
          }
        }
    answer: 4
    explanation: 'We do not write comments in code. Clear class names and simple code should explain themselves. If something needs a comment, rename or simplify it instead.'

  - id: conv-05
    type: spot-the-bug
    topic: naming
    difficulty: 1
    placement: false
    lint: false
    prompt: 'Code review: one line breaks our naming convention. Click it.'
    code:
      lang: scss
      label: post-card.component.scss
      source: |
        :host {
          .post-card {
            padding: 12px;
          }

          .postHeader {
            display: flex;
          }
        }
    answer: 6
    explanation: 'Class names are kebab-case: `.post-header`. The same goes for ids, SCSS variables and mixins (`$card-radius`, `@mixin flex-center`).'

  - id: conv-06
    type: spot-the-bug
    topic: colors
    difficulty: 1
    placement: false
    lint: false
    prompt: 'Code review: one color is not in our format. Click the line.'
    code:
      lang: scss
      label: post-header.component.scss
      source: |
        :host {
          .username {
            color: #262626;
          }

          .time {
            color: rgb(142, 142, 142);
          }
        }
    answer: 7
    explanation: 'All colors use the same format: lowercase hex, as XD gives them. `rgb(142, 142, 142)` is `#8e8e8e`. One format makes colors easy to search for and compare. For transparency use 8-digit hex, for example `#00000080`.'

  - id: conv-07
    type: spot-the-bug
    topic: units
    difficulty: 2
    placement: false
    lint: false
    prompt: 'Code review: one line uses a unit we only allow in one place. Click it.'
    code:
      lang: scss
      label: post-card.component.scss
      source: |
        :host {
          .post-card {
            width: 100%;
            max-height: 80vh;
            border: 1px solid #dbdbdb;
          }
        }
    answer: 4
    explanation: '`vh` and `vw` are used once, in the top-level app container. A component that measures the window ignores the layout around it (top bar, side panel), so it breaks when it is placed somewhere else. Inside components use `%` for sizes that follow the parent and `px` for fixed values from the design.'

  - id: conv-08
    type: spot-the-bug
    topic: tags
    difficulty: 1
    placement: false
    lint: false
    prompt: 'Code review: one selector breaks our conventions. Click it.'
    code:
      lang: scss
      label: post-card.component.scss
      source: |
        :host {
          .post-card {
            padding: 12px;

            img {
              width: 100%;
            }
          }
        }
    answer: 5
    explanation: 'We style classes, not tags. `img` matches every image in the card, including the avatar, so adding an image later changes it by surprise. Give the element a class (`.post-image`) and style that.'

  - id: conv-09
    type: spot-the-bug
    topic: host
    difficulty: 1
    placement: false
    lint: false
    prompt: 'Code review: one rule is in the wrong place. Click the line where it starts.'
    code:
      lang: scss
      label: post-card.component.scss
      source: |
        .post-card {
          border: 1px solid #dbdbdb;
        }

        :host {
          .post-image {
            width: 100%;
          }
        }
    answer: 1
    explanation: 'All component styles go inside `:host { }`. Only things that are not rules, like `@use`, variables and mixin definitions, sit above it.'

  - id: conv-10
    type: multiple
    topic: units
    difficulty: 2
    placement: false
    prompt: 'You are styling the post card component from the XD design. Which declarations follow our unit rules? Select all that apply.'
    options:
      - { text: '`width: 100%;`', correct: true }
      - { text: '`padding: 12px;`', correct: true }
      - { text: '`border: 1px solid #dbdbdb;`', correct: true }
      - { text: '`width: 614px;` (the width of the card on the XD artboard)', correct: false }
      - { text: '`min-height: 50vh;`', correct: false }
    explanation: 'Sizes that should follow the parent use `%`, so the card fits any screen. Fixed values from the design (spacing, borders, font sizes, icon sizes) use `px`. A fixed card width copied from the artboard only fits that one screen, and `vh`/`vw` belong only in the top-level app container.'

  - id: conv-11
    type: multiple
    topic: naming
    difficulty: 1
    placement: false
    prompt: 'Which names follow our naming convention? Select all that apply.'
    options:
      - { text: '`.story-ring`', correct: true }
      - { text: '`$story-size`', correct: true }
      - { text: '`.storyRing`', correct: false }
      - { text: '`.story_ring`', correct: false }
      - { text: '`.story__ring`', correct: false }
      - { text: '`@mixin flexCenter`', correct: false }
    explanation: 'Everything is kebab-case: lowercase words joined with `-`. No camelCase, no underscores, and no BEM `__` or `--`.'

  - id: conv-12
    type: single
    topic: wrappers
    difficulty: 2
    placement: false
    prompt: 'The username and the "Verified" badge should sit in one row. Which HTML is the best?'
    options:
      - { text: '`<div class="user-row"><span class="username">noa_k</span><img class="verified-badge" src="verified.svg"></div>`', correct: true }
      - { text: '`<div class="user-row"><div class="username-wrapper"><span class="username">noa_k</span></div><div class="badge-wrapper"><img class="verified-badge" src="verified.svg"></div></div>`', correct: false }
      - { text: '`<div class="user-row"><h3 class="username">noa_k</h3><img class="verified-badge" src="verified.svg"></div>`', correct: false }
      - { text: '`<div class="userRow"><span class="username">noa_k</span><img class="verified-badge" src="verified.svg"></div>`', correct: false }
    explanation: 'One parent for the flex row and one element per thing you see. The second option wraps each element in a useless `div`, the third uses a heading tag, and the fourth is not kebab-case.'
