module: 05-rxjs
title: 5. RxJS
questions:
  - id: rx-01
    type: fill
    topic: operators
    difficulty: 2
    placement: false
    prompt: 'The user types "cat", then quickly deletes the "t" and types it again, all in less than 300 ms. The search must not run again for the same term. What goes in the gap?'
    code:
      lang: ts
      label: user-search.component.ts
      source: |
        readonly results = toSignal(
          this.searchTerm$.pipe(
            debounceTime(300),
            ___(),
            switchMap((term) => this.usersApi.search(term).pipe(catchError(() => of([])))),
          ),
          { initialValue: [] },
        );
    options:
      - text: '`distinctUntilChanged`'
        correct: true
      - text: '`share`'
        correct: false
      - text: '`retry`'
        correct: false
      - text: '`take`'
        correct: false
    explanation: 'After the debounce, the term is "cat" again, the same as last time. `distinctUntilChanged` drops a value that equals the previous one, so no new request is sent. `share` and `retry` don''t compare values, and `take` would stop the search after a few terms.'
    reference: 10-rxjs/17-distinctuntilchanged.md

  - id: rx-02
    type: match
    topic: flattening
    difficulty: 2
    placement: false
    prompt: 'Match each situation with the flattening operator it needs.'
    pairs:
      - left: 'Search as the user types: only the latest term matters'
        right: '`switchMap`'
      - left: 'Save several comments, in the order they were written'
        right: '`concatMap`'
      - left: 'The user double-clicks "Log in": send only one request'
        right: '`exhaustMap`'
      - left: 'Like several different posts: send every like, in any order'
        right: '`mergeMap`'
    explanation: '`switchMap` cancels the previous request when a new value comes. `concatMap` waits for each one to finish before starting the next. `exhaustMap` ignores new values while a request is running. `mergeMap` runs them all in parallel.'
    reference: 10-rxjs/07-higher-order-observables.md

  - id: rx-03
    type: predict
    topic: error-handling
    difficulty: 3
    placement: false
    prompt: 'The search request fails once, and the user keeps typing. What happens?'
    code:
      lang: ts
      label: user-search.component.ts
      source: |
        readonly results = toSignal(
          this.searchTerm$.pipe(
            debounceTime(300),
            switchMap((term) => this.usersApi.search(term)),
            catchError(() => of([])),
          ),
          { initialValue: [] },
        );
    options:
      - text: 'The results stay empty: after the error the whole stream completed and ignores new terms'
        correct: true
      - text: 'The search keeps working; only the failed request returned `[]`'
        correct: false
      - text: 'The error is rethrown on the next keystroke'
        correct: false
    explanation: '`catchError` replaces the stream it is attached to. Here that is the outer stream, so it ends. Put `catchError` inside, on the request: `switchMap((term) => this.usersApi.search(term).pipe(catchError(() => of([]))))`.'
    reference: 10-rxjs/15-catcherror.md

  - id: rx-04
    type: fill
    topic: tap
    difficulty: 1
    placement: false
    prompt: 'This should emit `10, 20, 30`. What goes in the gap?'
    code:
      lang: ts
      source: |
        of(1, 2, 3).pipe(
          ___((n) => n * 10),
        )
    options:
      - text: '`map`'
        correct: true
      - text: '`tap`'
        correct: false
      - text: '`filter`'
        correct: false
      - text: '`switchMap`'
        correct: false
    explanation: '`map` replaces each value with what you return. `tap` is for side effects and ignores what you return, so it would emit `1, 2, 3`. `filter` keeps or drops values, and `switchMap` expects an observable back.'
    reference: 10-rxjs/12-map.md

  - id: rx-05
    type: pick-the-fix
    topic: flattening
    difficulty: 2
    placement: false
    prompt: 'This logs observables instead of profiles, and no request is sent. Which version fixes it?'
    code:
      lang: ts
      source: |
        this.selectedUsername$.pipe(
          map((username) => this.profileApi.getProfile(username)),
        ).subscribe((profile) => console.log(profile));
    options:
      - code: |
          this.selectedUsername$.pipe(
            switchMap((username) => this.profileApi.getProfile(username)),
          ).subscribe((profile) => console.log(profile));
        correct: true
      - code: |
          this.selectedUsername$.pipe(
            map((username) => this.profileApi.getProfile(username).subscribe()),
          ).subscribe((profile) => console.log(profile));
        correct: false
      - code: |
          this.selectedUsername$.pipe(
            tap((username) => this.profileApi.getProfile(username)),
          ).subscribe((profile) => console.log(profile));
        correct: false
    explanation: '`switchMap` subscribes to the inner observable and passes on its value: the profile. With `.subscribe()` inside `map`, the request is sent but the log shows a `Subscription`. `tap` ignores what you return, so it logs the username and still sends nothing.'
    reference: 10-rxjs/08-switchmap.md

  - id: rx-06
    type: spot-the-bug
    topic: unsubscribe
    difficulty: 2
    placement: false
    prompt: 'After the user leaves the feed, the app keeps calling the API every 30 seconds. Click the line that needs fixing.'
    code:
      lang: ts
      label: feed.component.ts
      source: |
        export class FeedComponent implements OnInit {
          private readonly store = inject(Store);

          ngOnInit() {
            interval(30000).subscribe(() => this.store.dispatch(PostsActions.refreshFeed()));
          }
        }
    answer: 5
    explanation: 'An `interval` subscription lives until it is unsubscribed, even after the component is gone. Stop it with the component: add `private readonly destroyRef = inject(DestroyRef);` and use `interval(30000).pipe(takeUntilDestroyed(this.destroyRef))`. `ngOnInit` is not an injection context, so `takeUntilDestroyed` needs the `DestroyRef` passed in.'
    reference: 04-signals/03-take-until-destroyed.md
